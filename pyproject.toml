[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metamodern-classical-for-agents"
version = "0.2.0"
description = "A persistent, agent-conducted metamodern noise-performance instrument for macOS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "sounddevice>=0.5,<1",
]

[project.scripts]
mcfa = "mcfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
